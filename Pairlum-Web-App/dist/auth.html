<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairlum</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A1226">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pairlum-core.css">
<script src="pairlum-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="pairlum-core.js"></script>
<style>
body{min-height:100vh;min-height:100svh}
.auth{display:grid;min-height:100vh;min-height:100svh}
.visual{position:relative;overflow:hidden;min-height:170px;background:radial-gradient(90% 70% at 70% 20%,color-mix(in srgb,var(--g3) 80%,#E6C3C0 20%) 0%,transparent 60%),linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3))}
.visual .vmono{position:absolute;right:var(--pad);top:50%;transform:translateY(-58%);font-size:clamp(5rem,16vw,8rem);color:color-mix(in srgb,var(--gtext) 88%,transparent)}
@media(min-width:900px){.visual .vmono{right:auto;left:var(--pad);top:clamp(80px,14vh,140px);transform:none;font-size:clamp(7rem,12vw,11rem)}}
.visual .vtx{position:absolute;left:var(--pad);right:var(--pad);bottom:22px;z-index:1;color:var(--gtext)}
.visual .pl-mono{opacity:.85}
.visual .vline{display:none;margin:0;font:400 var(--display-lg)/.86 var(--font-display);letter-spacing:-.038em;text-transform:uppercase}
.visual .vline em{text-transform:none;letter-spacing:-.055em}
.visual .vline .ln{display:block}
.panel{display:flex;flex-direction:column;min-width:0}
.panel .pl-top{width:100%}
.form-wrap{flex:1;width:100%;max-width:480px;margin:0 auto;padding:10px var(--pad) 40px}
.head{margin:8px 0 6px}
.head .ttl{margin:12px 0 0;font:400 var(--h2)/.95 var(--font-display);letter-spacing:-.034em}
.head .ttl em{font-style:italic;letter-spacing:-.05em}
.head p{margin:12px 0 0;color:var(--muted)}
form{margin-top:10px}
.form-err{margin-top:18px}
.submit{margin-top:24px}
.alt{margin-top:18px;font-size:.94rem;color:var(--muted)}
.alt a{color:var(--ink);font-weight:500}
.device{margin-top:26px}
.forgot{display:flex;justify-content:flex-end;margin-top:8px}
.pl-state{min-height:auto;padding:24px 0}
@media(min-width:900px){
  .auth{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .visual{min-height:100vh;min-height:100svh;position:sticky;top:0;height:100vh}
  .visual .vtx{bottom:clamp(32px,6vh,64px)}
  .visual .vline{display:block;margin-top:18px}
  .head .ttl{display:none}
  .form-wrap{display:flex;flex-direction:column;justify-content:center;padding-bottom:8vh}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to form</a>
<div class="auth">
  <div class="visual" aria-hidden="true">
    <span class="pl-monogram vmono">Pairlum</span>
    <div class="vtx"><span class="pl-mono">A private world for two people</span><p class="vline" id="vline"></p></div>
  </div>
  <div class="panel">
    <header class="pl-top"><a class="pl-wordmark" href="index.html" aria-label="Pairlum home">Pairlum</a><nav aria-label="Account" id="topnav"></nav></header>
    <main class="form-wrap" id="main" tabindex="-1"></main>
    <footer class="pl-foot"><a href="legal.html#privacy">Privacy</a><a href="legal.html#terms">Terms</a><span>Pairlum is for adults 18+.</span></footer>
  </div>
</div>
<script>
(function(){
var h=PL.h,$=PL.$,main=$('#main');
var next=PL.safeNext(PL.param('next'));
var LINES={
  signup:['<em>Begin</em>','something','that’s yours'],
  login:['<em>Welcome</em>','back'],
  forgot:['<em>Lost</em>','your way in?'],
  reset:['<em>Choose</em>','a new key']};
var TITLES={signup:'Create your account',login:'Log in',forgot:'Reset your password',reset:'Choose a new password'};
var EMAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
var startedSignup=false;

function view(){var v=(location.hash||'').slice(1).split('?')[0];return ['signup','login','forgot','reset'].indexOf(v)>-1?v:(PL.auth.account()?'login':'signup')}
function withNext(u){return next?u.replace('#','?next='+encodeURIComponent(next)+'#'):u}
function go(u){location.href=u}

function field(o){
  var id='f-'+o.name,eid=id+'-e',hid=o.hint?id+'-h':null;
  var inp=h('input',{class:'in',id:id,name:o.name,type:o.type||'text',autocomplete:o.ac||'off',required:true,'aria-describedby':[hid,eid].filter(Boolean).join(' '),inputmode:o.inputmode||null,maxlength:o.max||null,autocapitalize:o.type==='email'?'none':null,spellcheck:o.type==='email'?'false':null});
  if(o.value)inp.value=o.value;
  var control=inp;
  if(o.type==='password'){var sb=h('button',{type:'button',class:'show','aria-pressed':'false','aria-label':'Show password'},'Show');
    sb.addEventListener('click',function(){var on=inp.type==='password';inp.type=on?'text':'password';sb.textContent=on?'Hide':'Show';sb.setAttribute('aria-pressed',String(on));sb.setAttribute('aria-label',on?'Hide password':'Show password')});
    control=h('div',{class:'pw'},inp,sb)}
  var el=h('div',{class:'field'},h('label',{for:id},o.label),control,o.hint?h('span',{class:'hint',id:hid},o.hint):null,h('span',{class:'err',id:eid,'aria-live':'polite'}));
  el.input=inp;el.setErr=function(m){el.querySelector('.err').textContent=m||'';if(m)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid')};
  return el;
}
function formError(box,msg,kind){box.replaceChildren();if(!msg)return;
  box.append(h('div',{class:'notice '+(kind||'error'),role:'alert'},h('div',null,typeof msg==='string'?h('p',null,msg):msg)))}
function busy(btn,on,label){btn.disabled=on;btn.setAttribute('aria-busy',String(on));
  if(on){btn.dataset.label=btn.textContent;btn.replaceChildren(h('span',{class:'spin','aria-hidden':'true'}),label)}else if(btn.dataset.label){btn.textContent=btn.dataset.label}}
function errText(e,fallback){
  if(!e)return fallback;
  if(e.code==='offline'||navigator.onLine===false)return 'You’re offline. Check your connection, then try again.';
  if(e.code==='invalid_credentials')return 'That email and password don’t match. Try again, or reset your password.';
  if(e.code==='email_in_use')return h('p',null,'There’s already an account for this email. ',h('a',{href:withNext('auth.html#login')},'Log in instead'),'.');
  return fallback;
}
function deviceNote(){return h('p',{class:'device pl-pending'},'Device preview: this browser keeps one preview account. It does not create a cloud account or connect your partner.')}

function head(v){
  var ttl=h('h1',{class:'ttl',html:LINES[v].slice(0,1).join('')+' '+LINES[v].slice(1).join(' ')});
  return h('div',{class:'head'},h('span',{class:'pl-mono'},TITLES[v]),ttl);
}

function render(){
  var v=view();
  var sess=PL.auth.session();
  if(sess&&(v==='signup'||v==='login')&&!PL.qa.on){location.replace(next||PL.home());return}
  document.title=TITLES[v]+' — Pairlum';
  $('#vline').innerHTML=LINES[v].map(function(l){return '<span class="ln">'+l+'</span>'}).join('');
  var nav=$('#topnav');nav.replaceChildren();
  if(v==='signup')nav.append(h('a',{href:withNext('auth.html#login')},'Log in'));
  else nav.append(h('a',{href:withNext('auth.html#signup')},'Create account'));
  main.replaceChildren();
  ({signup:signup,login:login,forgot:forgot,reset:reset})[v]();
}

/* ---------- Sign up ---------- */
function signup(){
  var qa=PL.qa.state;
  var name=field({name:'name',label:'Your first name',ac:'given-name',max:40}),
      email=field({name:'email',label:'Email',type:'email',ac:'email',inputmode:'email',max:120}),
      pw=field({name:'password',label:'Password',type:'password',ac:'new-password',hint:'At least 8 characters.',max:200});
  var age=h('input',{type:'checkbox',id:'f-age',required:true,'aria-describedby':'f-age-e'});
  var ageRow=h('div',null,h('label',{class:'check',for:'f-age'},age,h('span',null,'I’m 18 or older, and I agree to the ',h('a',{href:'legal.html#terms',target:'_blank'},'Terms'),' and ',h('a',{href:'legal.html#privacy',target:'_blank'},'Privacy Policy'),'.')),h('span',{class:'err',id:'f-age-e','aria-live':'polite',style:'display:block;margin-top:6px;color:var(--danger);font-size:.86rem'}));
  var fe=h('div',{class:'form-err'}),btn=h('button',{class:'btn block submit',type:'submit'},'Create your account');
  var f=h('form',{novalidate:true},name,email,pw,ageRow,fe,btn);
  f.addEventListener('focusin',function(){if(!startedSignup){startedSignup=true;PL.track('signup_started',{method:'email'})}});
  var tried=false;
  function validate(){var ok=true;
    name.setErr(name.input.value.trim()?'':'Tell us what to call you.');if(!name.input.value.trim())ok=false;
    var em=email.input.value.trim();email.setErr(!em?'Enter your email.':!EMAIL.test(em)?'That email doesn’t look right.':'');if(!em||!EMAIL.test(em))ok=false;
    var p=pw.input.value;pw.setErr(p.length<8?'Use at least 8 characters.':'');if(p.length<8)ok=false;
    var ae=$('#f-age-e');ae.textContent=age.checked?'':'Pairlum is for adults 18+, and you need to agree to continue.';if(!age.checked){age.setAttribute('aria-invalid','true');ok=false}else age.removeAttribute('aria-invalid');
    return ok}
  f.addEventListener('input',function(){if(tried)validate()});
  f.addEventListener('submit',function(e){e.preventDefault();if(btn.disabled)return;tried=true;formError(fe);
    if(!validate()){var bad=f.querySelector('[aria-invalid=true]');if(bad)bad.focus();return}
    busy(btn,true,'Creating your account…');
    PL.auth.signUp({name:name.input.value.trim(),email:email.input.value.trim(),password:pw.input.value}).then(function(s){
      PL.track('signup_completed',{method:'email'});
      main.replaceChildren(h('div',{class:'pl-state',role:'status'},h('span',{class:'pl-mono'},'Account created'),
        h('p',{class:'st-big',html:'<em>Welcome,</em> '+PL.esc(s.name)+'.'}),h('p',{class:'st-sub'},'Opening your First Chapter…')));
      setTimeout(function(){go(next||'onboarding.html')},PL.motion.ok()?900:300);
    },function(err){busy(btn,false);
      if(err&&err.code==='confirm_email'){
        PL.track('signup_completed',{method:'email'});
        main.replaceChildren(h('div',{class:'pl-state',role:'status'},h('span',{class:'pl-mono'},'Check your inbox'),
          h('p',{class:'st-big',html:'<em>Almost</em> there.'}),
          h('p',{class:'st-sub'},'We sent a confirmation link to '+PL.esc(err.email)+'. Open it to activate your account, then log in.'),
          h('div',{class:'st-act'},h('a',{class:'btn',href:withNext('auth.html#login')},'Back to log in'))));
        return;
      }
      formError(fe,err&&err.code==='device_account_exists'?'This browser already has a preview account. Log in with that account, or use a separate browser profile.':errText(err,'We couldn’t create your account just now. Please try again.'))});
  });
  main.append(head('signup'),h('p',{class:'pl-sub',style:'margin-top:10px'},'One account each. You’ll invite your person next.'),f,
    h('p',{class:'alt'},'Already have an account? ',h('a',{href:withNext('auth.html#login')},'Log in')),
    PL.auth.mode()==='device'?deviceNote():null);
  if(qa==='signup-error')formError(fe,'We couldn’t create your account just now. Please try again.');
  if(qa==='email-in-use')formError(fe,errText({code:'email_in_use'}));
}

/* ---------- Log in ---------- */
function login(){
  var qa=PL.qa.state,acc=PL.auth.account();
  var email=field({name:'email',label:'Email',type:'email',ac:'username',inputmode:'email',value:acc&&acc.email}),
      pw=field({name:'password',label:'Password',type:'password',ac:'current-password'});
  var fe=h('div',{class:'form-err'}),btn=h('button',{class:'btn block submit',type:'submit'},'Log in');
  var f=h('form',{novalidate:true},email,pw,h('div',{class:'forgot'},h('a',{class:'link',href:'auth.html#forgot'},'Forgot password?')),fe,btn);
  f.addEventListener('submit',function(e){e.preventDefault();if(btn.disabled)return;formError(fe);
    var em=email.input.value.trim(),p=pw.input.value,ok=true;
    email.setErr(!em?'Enter your email.':!EMAIL.test(em)?'That email doesn’t look right.':'');if(!em||!EMAIL.test(em))ok=false;
    pw.setErr(p?'':'Enter your password.');if(!p)ok=false;
    if(!ok){f.querySelector('[aria-invalid=true]').focus();return}
    busy(btn,true,'Logging in…');
    PL.auth.signIn({email:em,password:p}).then(function(){go(next||PL.home())},
      function(err){busy(btn,false);formError(fe,errText(err,'We couldn’t log you in just now. Please try again.'));pw.input.value='';pw.input.focus()});
  });
  main.append(head('login'),f,h('p',{class:'alt'},'New to Pairlum? ',h('a',{href:withNext('auth.html#signup')},'Create an account')),
    PL.auth.mode()==='device'?deviceNote():null);
  if(qa==='login-error')formError(fe,errText({code:'invalid_credentials'}));
  if(qa==='offline')formError(fe,errText({code:'offline'}));
}

/* ---------- Forgot ---------- */
function forgot(){
  var qa=PL.qa.state,acc=PL.auth.account();
  var email=field({name:'email',label:'Email',type:'email',ac:'email',inputmode:'email',value:acc&&acc.email,hint:'We’ll send a link to choose a new password.'});
  var fe=h('div',{class:'form-err'}),btn=h('button',{class:'btn block submit',type:'submit'},'Send reset link');
  var f=h('form',{novalidate:true},email,fe,btn);
  function sent(addr){main.replaceChildren(h('div',{class:'pl-state',role:'status'},h('span',{class:'pl-mono'},'Check your inbox'),
    h('p',{class:'st-big',html:'<em>It’s</em> on its way.'}),h('p',{class:'st-sub'},'If there’s an account for '+addr+', a link to reset your password will arrive shortly. It works once, for a limited time.'),
    h('div',{class:'st-act'},h('a',{class:'btn ghost',href:'auth.html#login'},'Back to log in'))))}
  function notYet(){formError(fe,h('div',null,h('p',null,h('b',null,'Reset emails aren’t switched on yet.')),h('p',null,'They start working when Pairlum accounts are connected. Nothing was sent.')),'pending')}
  f.addEventListener('submit',function(e){e.preventDefault();if(btn.disabled)return;formError(fe);
    var em=email.input.value.trim();email.setErr(!em?'Enter your email.':!EMAIL.test(em)?'That email doesn’t look right.':'');
    if(!em||!EMAIL.test(em)){email.input.focus();return}
    busy(btn,true,'Sending…');
    PL.auth.requestReset(em).then(function(){busy(btn,false);sent(em)},function(err){busy(btn,false);
      if(PL.isPending(err))notYet();else formError(fe,errText(err,'We couldn’t send the link just now. Please try again.'))});
  });
  main.append(head('forgot'),f,h('p',{class:'alt'},h('a',{href:'auth.html#login'},'Back to log in')));
  if(qa==='forgot-sent')sent('you@example.com');
  if(qa==='forgot-pending')notYet();
}

/* ---------- Reset (arrives from the email link: auth.html?token=…#reset) ---------- */
function reset(){
  var qa=PL.qa.state,token=PL.param('token');
  function invalid(){main.replaceChildren(h('div',{class:'pl-state',role:'alert'},h('span',{class:'pl-mono'},'Link expired'),
    h('p',{class:'st-big',html:'<em>This</em> link has run out.'}),h('p',{class:'st-sub'},'Reset links work once and only for a short time. Ask for a fresh one and use it straight away.'),
    h('div',{class:'st-act'},h('a',{class:'btn',href:'auth.html#forgot'},'Send a new link'),h('a',{class:'link',href:'auth.html#login'},'Back to log in'))))}
  function done(){main.replaceChildren(h('div',{class:'pl-state',role:'status'},h('span',{class:'pl-mono'},'Password updated'),
    h('p',{class:'st-big',html:'<em>All</em> set.'}),h('p',{class:'st-sub'},'Your new password is ready. Log in to go back to your world.'),
    h('div',{class:'st-act'},h('a',{class:'btn',href:'auth.html#login'},'Log in'))))}
  if(qa==='reset-invalid'||(!token&&qa!=='reset-success'&&qa!=='reset-form')){invalid();return}
  if(qa==='reset-success'){done();return}
  var pw=field({name:'password',label:'New password',type:'password',ac:'new-password',hint:'At least 8 characters.'}),
      pw2=field({name:'password2',label:'Type it again',type:'password',ac:'new-password'});
  var fe=h('div',{class:'form-err'}),btn=h('button',{class:'btn block submit',type:'submit'},'Save new password');
  var f=h('form',{novalidate:true},pw,pw2,fe,btn);
  f.addEventListener('submit',function(e){e.preventDefault();if(btn.disabled)return;formError(fe);
    var a=pw.input.value,b=pw2.input.value,ok=true;
    pw.setErr(a.length<8?'Use at least 8 characters.':'');if(a.length<8)ok=false;
    pw2.setErr(b!==a?'These don’t match yet.':'');if(b!==a)ok=false;
    if(!ok){f.querySelector('[aria-invalid=true]').focus();return}
    busy(btn,true,'Saving…');
    PL.auth.resetPassword(token,a).then(function(){done()},function(err){busy(btn,false);
      if(err&&(err.code==='invalid_token'||err.code==='expired_token'))invalid();
      else if(PL.isPending(err))formError(fe,h('div',null,h('p',null,h('b',null,'Password resets aren’t switched on yet.')),h('p',null,'They start working when Pairlum accounts are connected. Your password wasn’t changed.')),'pending');
      else formError(fe,errText(err,'We couldn’t save your new password. Please try again.'))});
  });
  main.append(head('reset'),f);
}

window.addEventListener('hashchange',function(){render();main.focus({preventScroll:true})});
render();
})();
</script>
</body>
</html>
