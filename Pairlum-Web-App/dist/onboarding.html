<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your First Chapter — Pairlum</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A1226">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pairlum-core.css">
<script src="pairlum-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="pairlum-core.js"></script>
<style>
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.top .pl-top{padding-top:14px;padding-bottom:10px}
.steptxt{color:var(--muted)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.22,1,.36,1)}
.wrap{max-width:1240px;margin:0 auto;padding:18px var(--pad) 60px;display:grid;gap:40px}
.step{max-width:560px;min-width:0}
.step:focus{outline:none}
.step .pl-mono{color:var(--muted)}
.q{margin:14px 0 0;font:400 var(--h1)/.95 var(--font-display);letter-spacing:-.035em;text-wrap:balance}
.q em{font-style:italic;letter-spacing:-.05em}
.q:focus{outline:none}
.sub{margin:14px 0 0;color:var(--muted);font-size:1.02rem;max-width:44ch}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:30px}
.acts .sp{flex:1}
.row2{display:grid;gap:0 14px}
@media(min-width:520px){.row2{grid-template-columns:1fr 1fr}}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card)}
.swrow label{font-weight:500}
.ldr{margin-top:6px;padding:4px 0 0 16px;border-left:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.faces{display:flex;gap:18px;margin-top:24px}
.face{position:relative;width:120px}
.face .ph{position:relative;display:grid;place-items:center;width:120px;height:120px;border-radius:50%;background:linear-gradient(155deg,var(--av1a),var(--av1b) 70%,var(--av1c));color:var(--av-text);font:400 2rem var(--font-display);overflow:hidden;cursor:pointer}
.face.b .ph{background:linear-gradient(155deg,var(--av2a),var(--av2b) 70%,var(--av2c))}
.face .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face input{position:absolute;inset:0;opacity:0;cursor:pointer}
.face .ph:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.face small{display:block;margin-top:8px;text-align:center;font-size:.84rem;color:var(--muted)}
.face .rm{display:block;margin:2px auto 0}
.pv{display:none}
.pvcard{position:relative;overflow:hidden;padding:28px;border-radius:28px;background:linear-gradient(155deg,var(--g1),var(--g2) 55%,var(--g3));color:var(--gtext);box-shadow:0 30px 60px -34px rgba(0,0,0,.5)}
.pvcard .pl-mono{opacity:.75}
.pv-av{display:flex;margin-top:22px}
.pv-av span{position:relative;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gtext) 60%,transparent);background:linear-gradient(155deg,var(--av1a),var(--av1b) 70%,var(--av1c));font:400 1.2rem var(--font-display);color:var(--av-text);overflow:hidden}
.pv-av span+span{margin-left:-14px;background:linear-gradient(155deg,var(--av2a),var(--av2b) 70%,var(--av2c))}
.pv-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv-names{margin:18px 0 0;font:400 clamp(2rem,3.4vw,3rem)/.95 var(--font-display);letter-spacing:-.035em}
.pv-line{margin:14px 0 0;font:400 1.1rem/1.35 var(--font-display);font-style:italic;opacity:.92}
.pv-meta{margin-top:16px;display:grid;gap:6px}
.pv-mem{margin-top:22px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--gtext) 12%,transparent)}
.pv-mem p{margin:6px 0 0;font:400 1.2rem/1.2 var(--font-display)}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,560px) minmax(0,440px);justify-content:space-between;padding-top:40px}.pv{display:block;position:sticky;top:96px;align-self:start}}
.summary{margin-top:24px}
.summary .pvcard{padding:22px}
@media(min-width:960px){.summary{display:none}}
.invite{margin-top:24px;padding:20px;border-radius:22px;border:1.5px solid var(--line);background:var(--card)}
.code b{font:500 1.4rem var(--font-mono);letter-spacing:.08em}
.linkbox{margin-top:14px}
.linkbox input{font:400 .88rem var(--font-mono)}
.share{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.waiting{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.dots{display:inline-flex;gap:4px;flex:none}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.25;transform:translateY(-2px)}}
.reveal{position:fixed;inset:0;z-index:50;display:grid;align-content:center;padding:40px var(--pad);background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3));color:var(--gtext);overflow:auto}
.reveal .in-r{max-width:1100px;width:100%;margin:0 auto}
.reveal .pl-mono{opacity:.8}
.reveal .rule{display:block;height:1px;width:0;margin:18px 0 0;background:currentColor;opacity:.5;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.reveal.on .rule{width:min(320px,60vw)}
.reveal .head{margin:26px 0 0;font:400 var(--display-lg)/.86 var(--font-display);letter-spacing:-.038em;text-transform:uppercase}
.reveal .head:focus{outline:none}
.reveal .head em{text-transform:none;letter-spacing:-.055em}
.reveal .mask{display:block;overflow:hidden;padding-bottom:.04em}
.reveal .mask>span{display:block;transform:translateY(110%);opacity:0;transition:transform 950ms cubic-bezier(.22,1,.36,1),opacity 420ms ease}
.reveal.on .mask>span{transform:none;opacity:1}
.reveal.on .mask:nth-child(2)>span{transition-delay:.12s}.reveal.on .mask:nth-child(3)>span{transition-delay:.24s}
.reveal .memcard{margin-top:34px;max-width:520px;padding:18px 20px;border-radius:20px;background:color-mix(in srgb,var(--gtext) 12%,transparent);opacity:0;transform:translateY(16px);transition:opacity .8s ease 1s,transform .8s cubic-bezier(.22,1,.36,1) 1s}
.reveal .memcard img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px}
.reveal .memcard p{margin:8px 0 0;font:400 1.35rem/1.2 var(--font-display);white-space:pre-wrap}
.reveal.on .memcard{opacity:1;transform:none}
.reveal .after{margin-top:30px;opacity:0;transition:opacity .8s ease 1.9s}
.reveal.on .after{opacity:1}
.reveal .after p{margin:0;max-width:44ch;opacity:.85;font-size:1.02rem}
.reveal .after .acts{margin-top:22px}
.reveal .btn{background:var(--gtext);color:var(--g2)}
.reveal .link{color:var(--gtext)}
.reveal-still .mask>span,.reveal-still .memcard,.reveal-still .after,.reveal-still .rule{transition:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="top">
  <header class="pl-top"><a class="pl-wordmark" href="index.html" aria-label="Pairlum home">Pairlum</a><span class="pl-mono steptxt" id="steptxt" aria-live="polite"></span></header>
  <div class="bar" role="progressbar" aria-label="First Chapter progress" aria-valuemin="0" aria-valuemax="100" id="barw"><i id="bar"></i></div>
</div>
<div class="wrap">
  <main class="step" id="main" tabindex="-1"></main>
  <aside class="pv" aria-label="Preview of your space"><div id="pv"></div></aside>
</div>
<script>
(function(){
if(!PL.requireSession())return;
var h=PL.h,$=PL.$,sess=PL.auth.session();
var space=PL.space.get();
/* "First Chapter" is YOUR OWN onboarding completion (profiles.first_chapter_done), never
   the space's — the space has no completion state of its own (see PL.progress). */
if(space&&PL.progress.done()&&PL.param('again')!=='1'&&!PL.qa.on){location.replace('world.html');return}
/* Did I make this space, or did I join someone else's via invite? An invited partner must
   never be pushed into the create/invite steps for a space they didn't create. */
var iCreatedThisSpace=!space||space.isCreator!==false;

var ORDER=['you','person','story','faces','create','invite','memory','reveal'];
var S=Object.assign({step:'you',name:'',pname:'',stage:'',since:'',ldr:false,myCity:'',theirCity:'',reunion:'',pa:'',pb:'',invited:false},PL.read(PL.KEYS.onb,{})||{});
/* bring forward anything typed into the earlier onboarding build */
(function(){var old=PL.read('pl-onb',null);if(!old||S.migrated)return;
  if(!S.name&&old.name)S.name=old.name;if(!S.pname&&old.pname)S.pname=old.pname;if(!S.stage&&old.stage)S.stage=old.stage;
  if(!S.since&&old.since)S.since=old.since;if(old.ld)S.ldr=true;if(!S.pa&&old.pa)S.pa=old.pa;if(!S.pb&&old.pb)S.pb=old.pb;S.migrated=true})();
if(!S.name&&sess&&sess.name)S.name=sess.name;
if(ORDER.indexOf(S.step)<0)S.step='you';
if(space&&iCreatedThisSpace&&ORDER.indexOf(S.step)<ORDER.indexOf('invite'))S.step='invite';   /* my space already made: never re-create it */
if(space&&!iCreatedThisSpace&&ORDER.indexOf(S.step)>=ORDER.indexOf('create')&&ORDER.indexOf(S.step)<ORDER.indexOf('memory'))S.step='memory'; /* invited partner: create/invite are not mine to do */
if(!iCreatedThisSpace&&S.step==='story')S.step='faces'; /* relationship stage/since/cities belong to the space and were already set when it was created; an invited partner doesn't redefine them */
if(!space&&ORDER.indexOf(S.step)>ORDER.indexOf('create'))S.step='create';
var qaStep=PL.qa.state&&PL.qa.state.split('-')[0];
if(qaStep&&ORDER.indexOf(qaStep)>-1&&(space||ORDER.indexOf(qaStep)<=ORDER.indexOf('create')))S.step=qaStep;
function save(){PL.writeSafe(PL.KEYS.onb,S);if(space&&!iCreatedThisSpace&&typeof writeMyIdentity==='function')writeMyIdentity()}
var main=$('#main'),dir=1;
var nm=function(){return S.name.trim()||'you'},pn=function(){return S.pname.trim()||'your person'};
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
var todayIso=iso(new Date());
function days(){return S.since?Math.floor((Date.now()-new Date(S.since+'T00:00'))/864e5):null}
function initials(n){return (n||'').trim().split(/\s+/).map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase()}

/* ---------- field helpers ---------- */
function text(label,key,o){o=o||{};var id='f-'+key;
  var inp=h('input',{class:'in',id:id,type:o.type||'text',autocomplete:o.ac||'off',maxlength:o.type==='date'?null:(o.max||60),max:o.maxv||null,min:o.minv||null,'aria-describedby':id+'-e'+(o.hint?' '+id+'-h':'')});
  inp.value=S[key]||'';
  inp.addEventListener(o.type==='date'?'change':'input',function(){S[key]=inp.value;save();pv();clearErr()});
  var e=h('div',{class:'field'},h('label',{for:id},label),inp,o.hint?h('span',{class:'hint',id:id+'-h'},o.hint):null,h('span',{class:'err',id:id+'-e','aria-live':'polite'}));
  e.input=inp;function clearErr(){e.querySelector('.err').textContent='';inp.removeAttribute('aria-invalid')}
  e.setErr=function(m){e.querySelector('.err').textContent=m;inp.setAttribute('aria-invalid','true')};return e}
function toggleRow(label,key,onChange){var id='t-'+key;
  var b=h('button',{type:'button',class:'toggle',role:'switch',id:id,'aria-checked':String(!!S[key])});
  b.addEventListener('click',function(){S[key]=!S[key];b.setAttribute('aria-checked',String(S[key]));save();pv();onChange&&onChange()});
  return h('div',{class:'swrow'},h('label',{for:id},label),b)}

/* ---------- live preview ---------- */
function pvCard(){
  var d=days(),a=h('span',null,S.pa?h('img',{src:S.pa,alt:''}):initials(S.name)),b=h('span',null,S.pb?h('img',{src:S.pb,alt:''}):initials(S.pname));
  var meta=h('div',{class:'pv-meta'});
  if(S.stage)meta.append(h('span',{class:'pl-mono'},S.stage));
  if(S.ldr&&(S.myCity||S.theirCity))meta.append(h('span',{class:'pl-mono'},[S.myCity||'Here',S.theirCity||'There'].join('  ·  ')));
  if(S.ldr&&S.reunion){var rd=Math.ceil((new Date(S.reunion+'T00:00')-Date.now())/864e5);if(rd>0)meta.append(h('span',{class:'pl-mono'},rd+(rd===1?' day':' days')+' until you’re together'))}
  var line=d==null||d<0?'Day one.':d===0?'Day one, today.':d.toLocaleString()+' days into your story.';
  var c=h('div',{class:'pvcard'},h('span',{class:'pl-mono'},space?'Our space':'Your space, taking shape'),h('div',{class:'pv-av','aria-hidden':'true'},a,b),
    h('p',{class:'pv-names'},(S.name.trim()||'You')+' & '+(S.pname.trim()||'your person')),h('p',{class:'pv-line'},line),meta);
  var w=PL.read(PL.KEYS.world,{})||{},m=(w.moments||[]).filter(function(x){return x.by==='me'}).slice(-1)[0];
  if(space&&m)c.append(h('div',{class:'pv-mem'},h('span',{class:'pl-mono'},'First memory'),h('p',null,m.text||'A photo')));
  return c;
}
function pv(){$('#pv').replaceChildren(pvCard())}

/* ---------- render ---------- */
var LABEL={you:'You',person:'Your person',story:'Your story',faces:'Faces',create:'Our space',invite:'Invite',memory:'First memory',reveal:'Chapter complete'};
function progress(){var i=ORDER.indexOf(S.step),n=ORDER.length-1,pct=Math.round(i/n*100);
  $('#bar').style.width=pct+'%';$('#barw').setAttribute('aria-valuenow',pct);$('#barw').setAttribute('aria-valuetext',LABEL[S.step]);
  $('#steptxt').textContent=S.step==='reveal'?'Chapter one':'Chapter one · '+String(i+1).padStart(2,'0')+' / 07';
  document.title=LABEL[S.step]+' — Your First Chapter — Pairlum'}
function head(label,q,sub){return [h('span',{class:'pl-mono'},label),h('h1',{class:'q',tabindex:'-1',html:q}),sub?h('p',{class:'sub'},sub):null]}
function go(step){dir=ORDER.indexOf(step)>=ORDER.indexOf(S.step)?1:-1;S.step=step;save();render();scrollTo(0,0)}
function render(){
  progress();main.replaceChildren();pv();
  ({you:you,person:person,story:story,faces:faces,create:create,invite:invite,memory:memory,reveal:reveal})[S.step]();
  if(S.step!=='reveal'){
    if(PL.motion.ok()&&main.animate)main.animate([{opacity:0,transform:'translateX('+(dir*24)+'px)'},{opacity:1,transform:'none'}],{duration:360,easing:'cubic-bezier(.16,1,.3,1)'});
    var q=main.querySelector('.q');if(q)q.focus({preventScroll:true});
  }
}
function actions(o){
  var a=h('div',{class:'acts'});
  if(o.back)a.append(h('button',{type:'button',class:'btn ghost',onclick:function(){go(o.back)}},'Back'));
  if(o.next)a.append(o.next);
  if(o.skip)a.append(h('button',{type:'button',class:'link',onclick:o.skip[1]},o.skip[0]));
  return a}
function nextBtn(label){return h('button',{type:'submit',class:'btn'},label)}
function formStep(children,onSubmit){var f=h('form',{novalidate:true},children);f.addEventListener('submit',function(e){e.preventDefault();onSubmit()});return f}
function ap(arr){arr.forEach(function(x){if(x)main.append(x)})}

function you(){
  var name=text('Your first name','name',{ac:'given-name',max:40,hint:'This is the name your person will see.'});
  ap(head('01 · You','<em>First,</em> what should we call you?').concat([
    formStep([name,actions({next:nextBtn('Continue')})],function(){if(!S.name.trim()){name.setErr('Tell us your name.');name.input.focus();return}go('person')})]));
}
function person(){
  var pname=text('Their first name','pname',{max:40});
  var stageField=null;
  var fields=[pname];
  if(iCreatedThisSpace){
    var err=h('span',{class:'err',id:'stage-e','aria-live':'polite'});
    var chips=h('div',{class:'chips',role:'group','aria-labelledby':'stage-l','aria-describedby':'stage-e'});
    ['Getting to know each other','Dating','Engaged','Married'].forEach(function(v){var b=h('button',{type:'button',class:'chip','aria-pressed':String(S.stage===v),onclick:function(){S.stage=v;save();pv();err.textContent='';[].forEach.call(chips.children,function(x){x.setAttribute('aria-pressed',String(x===b))})}},v);chips.append(b)});
    stageField=h('div',{class:'field'},h('span',{class:'lab',id:'stage-l'},'Where are you two right now? (optional)'),chips,err);
    fields.push(stageField);
  }
  ap(head('02 · Your person',iCreatedThisSpace?'Who’s <em>your</em> person, '+PL.esc(nm())+'?':'<em>Who</em> invited you here?',iCreatedThisSpace?'You’ll invite them in a moment. Everything here is private to the two of you.':'Just so Pairlum knows what to call them. They keep control of their own name and photo — this doesn’t change anything on their side.').concat([
    formStep(fields.concat([actions({back:'you',next:nextBtn('Continue')})]),function(){
      if(!S.pname.trim()){pname.setErr('Add their first name.');pname.input.focus();return}
      go('story')})]));
}
function story(){
  var since=text('The day it began (optional)','since',{type:'date',maxv:todayIso,hint:'We’ll count the days and remember your anniversary.'});
  var ldrBox=h('div',{class:'ldr',hidden:!S.ldr});
  function fillLdr(){ldrBox.replaceChildren(h('div',{class:'row2'},text('Where you are','myCity',{hint:'City or country',max:50}),text('Where they are','theirCity',{hint:'City or country',max:50})),
    text('Next time you’ll be together (optional)','reunion',{type:'date',minv:todayIso}));ldrBox.hidden=!S.ldr}
  fillLdr();
  ap(head('03 · Your story','<em>When</em> did your story begin?').concat([
    formStep([since,toggleRow('We live in different places right now','ldr',fillLdr),ldrBox,actions({back:'person',next:nextBtn('Continue')})],function(){
      if(S.since&&S.since>todayIso){since.setErr('Choose a day that has already happened.');since.input.focus();return}
      if(S.ldr&&S.reunion&&S.reunion<todayIso){var r=$('#f-reunion');r.setAttribute('aria-invalid','true');$('#f-reunion-e').textContent='Choose a day that’s still ahead.';r.focus();return}
      go('faces')})]));
}
function faces(){
  /* Only your own photo. Your person chooses theirs when they're here — one partner
     picking a photo "of" the other and having it stick permanently isn't something
     Pairlum does. */
  function face(key,cls,label){
    var ph=h('div',{class:'ph'},S[key]?h('img',{src:S[key],alt:''}):initials(S.name));
    var inp=h('input',{type:'file',accept:'image/*','aria-label':label});ph.append(inp);
    var msg=h('small',{'aria-live':'polite'},'You');
    var rm=S[key]?h('button',{type:'button',class:'link rm',onclick:function(){S[key]='';save();render()}},'Remove'):null;
    inp.addEventListener('change',function(){var f=inp.files&&inp.files[0];if(!f)return;var c=PL.media.check(f);
      if(c){msg.textContent=c==='too_large'?'That photo is over 20 MB':'Choose a JPEG, PNG, WebP or GIF';return}
      msg.textContent='Preparing…';
      PL.media.prepare(f,360).then(function(b){return new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result)};fr.readAsDataURL(b)})})
        .then(function(u){S[key]=u;if(!PL.writeSafe(PL.KEYS.onb,S)){S[key]='';msg.textContent='Not enough space on this device';return}render()},function(){msg.textContent='We couldn’t open that photo'})});
    return h('div',{class:'face '+cls},ph,msg,rm)}
  ap(head('04 · Faces','<em>Put</em> a face to the story','Optional. You can change this anytime. '+pn()+' adds their own when they arrive.').concat([
    h('div',{class:'faces'},face('pa','a','Choose a photo of you')),
    actions({back:iCreatedThisSpace?'story':'person',next:h('button',{type:'button',class:'btn',onclick:function(){go('create')}},S.pa?'Continue':'Skip for now')})]));
}
function writeWorld(){
  /* Only the creator calls this, and only for their OWN identity (w.me) plus the
     shared space context. w.partner.name here is a placeholder label — what the
     creator expects to call their person until that person actually joins and sets
     their own name/photo. We never set a partner photo from here: a photo one
     partner picked "of" the other isn't something Pairlum carries forward as that
     person's real profile picture. */
  var w=PL.read(PL.KEYS.world,{})||{};
  w.me=Object.assign({pulse:'steady'},w.me||{},{name:S.name.trim(),photo:S.pa||''});
  w.partner=Object.assign({pulse:'',joined:false},w.partner||{},{name:S.pname.trim(),photoPlaceholder:true});
  delete w.partner.photo;
  if(w.partner.joined!==true){w.partner.joined=false;w.partner.pulse=''}
  w.since=S.since||'';w.ldr=!!S.ldr;w.stage=S.stage;
  w.cities=S.ldr?{me:S.myCity.trim(),them:S.theirCity.trim()}:null;
  w.ldrLabel=S.ldr?[S.myCity.trim(),S.theirCity.trim()].filter(Boolean).join(' · '):'';
  w.reunion=S.ldr?(S.reunion||''):(w.reunion||'');
  w.moments=Array.isArray(w.moments)?w.moments:[];w.letters=w.letters||[];w.plans=w.plans||[];w.unfinished=w.unfinished||[];
  w.rituals=w.rituals||[{id:1,label:'Sunday voice note',cadence:'Weekly',last:''}];
  w.settings=Object.assign({sound:true,haptics:true,motion:true},w.settings||{});
  w.mood=PL.mood.get();w.demoCleared=true;
  PL.write(PL.KEYS.world,w);
}
/* The invited partner's own name/photo — captured on their own device during their own
   onboarding, and never routed through the creator's flow (see writeWorld above). This
   keeps running as their fields fill in, and never touches w.partner or shared space
   fields, which are the creator's to have set when the space was made. */
function writeMyIdentity(){
  var w=PL.read(PL.KEYS.world,{})||{};
  w.me=Object.assign({pulse:'steady'},w.me||{},{name:S.name.trim()||(w.me&&w.me.name)||'',photo:S.pa||(w.me&&w.me.photo)||''});
  w.moments=Array.isArray(w.moments)?w.moments:[];w.letters=w.letters||[];w.plans=w.plans||[];w.unfinished=w.unfinished||[];
  w.rituals=w.rituals||[{id:1,label:'Sunday voice note',cadence:'Weekly',last:''}];
  w.settings=Object.assign({sound:true,haptics:true,motion:true},w.settings||{});
  PL.write(PL.KEYS.world,w);
}
function create(){
  if(space&&!iCreatedThisSpace){go('memory');return} /* defensive: this step is never mine when I joined via invite */
  var err=h('div',{'aria-live':'polite'});
  var btn=h('button',{type:'button',class:'btn'},space?'Continue':'Create our space');
  btn.addEventListener('click',function(){
    if(space){go('invite');return}
    if(btn.disabled)return;btn.disabled=true;btn.replaceChildren(h('span',{class:'spin','aria-hidden':'true'}),'Creating your space…');err.replaceChildren();
    PL.space.create({since:S.since||null,ldr:!!S.ldr,myCity:S.ldr?S.myCity.trim():null,theirCity:S.ldr?S.theirCity.trim():null})
      .then(function(sp){writeWorld();space=sp;PL.track('space_created',{ldr:!!S.ldr});go('invite')}).catch(function(){
      btn.disabled=false;btn.textContent='Try again';
      err.append(h('div',{class:'notice error',role:'alert',style:'margin-top:18px'},h('p',null,'Your space wasn’t created. There may not be enough space on this device. Please try again.')))});
  });
  ap(head('05 · Our space',space?'<em>Your</em> space is ready':'<em>This</em> is where it all lives','A private world for the two of you. No public profile, no followers, no likes. Just yours.').concat([
    h('div',{class:'summary'},pvCard()),err,actions({back:space?null:'faces',next:btn}),
    PL.auth.mode()==='device'?h('p',{class:'pl-pending',style:'margin-top:22px'},'Preview · your space is kept on this device until accounts are connected'):null]));
}
function invite(){
  if(space&&!iCreatedThisSpace){go('memory');return} /* defensive: I joined this space, I don't invite into it */
  var code=space.inviteCode,link=PL.invites.link(code);
  var msg='I made us a private space on Pairlum. Join me: '+link+' (code '+code+')';
  var state=PL.qa.state==='invite-connected'?'connected':(S.invited||PL.qa.state==='invite-waiting'?'waiting':'share');
  var box=h('div',{class:'invite'});
  function sent(ch){S.invited=true;save();PL.track('invite_sent',{channel:ch});if(state!=='waiting'){state='waiting';draw()}}
  function copy(){var done=function(){PL.toast('Invite copied');sent('copy')};
    function fallback(){var ta=h('textarea',{class:'vh'});ta.value=msg;document.body.append(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)done();else PL.toast('Select the link and copy it')}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(done,fallback);else fallback()}
  function draw(){box.replaceChildren();
    if(state==='connected'){box.append(h('span',{class:'pl-mono',style:'color:var(--ok)'},'Connected'),h('p',{class:'q',style:'font-size:var(--h3);margin-top:10px',html:'<em>'+PL.esc(pn())+'</em> is here.'}),h('p',{class:'sub'},'Your space belongs to both of you now. Anything either of you adds shows up for the other.'));return}
    var li=h('input',{class:'in',readonly:true,value:link,id:'invlink'});li.addEventListener('focus',function(){li.select()});
    box.append(h('div',{class:'code'},h('span',{class:'pl-mono',style:'color:var(--muted)'},'Invite code'),h('b',{style:'display:block;margin-top:4px'},code)),
      h('div',{class:'field linkbox'},h('label',{for:'invlink'},'Invite link'),li),
      h('div',{class:'share'},h('button',{type:'button',class:'btn sm',onclick:copy},'Copy invite'),
        h('a',{class:'btn sm ghost',href:'https://wa.me/?text='+encodeURIComponent(msg),target:'_blank',rel:'noopener',onclick:function(){sent('whatsapp')}},'WhatsApp'),
        navigator.share?h('button',{type:'button',class:'btn sm ghost',onclick:function(){navigator.share({title:'Pairlum',text:msg}).then(function(){sent('native')},function(){})}},'More…'):null));
    if(state==='waiting')box.append(h('div',{class:'waiting',role:'status'},h('span',{class:'dots','aria-hidden':'true'},h('i'),h('i'),h('i')),h('span',null,'Waiting for '+pn()+' to join. You can keep going; their side lights up when they do.')));
    if(PL.auth.mode()==='device')box.append(h('p',{class:'pl-pending',style:'margin-top:16px'},'Preview · invite links start working when your account is connected to a real backend'));
  }
  draw();
  /* ask the server whether the partner has joined */
  PL.invites.partnerStatus().then(function(st){if(st&&st.joined){state='connected';draw()}},function(){});
  ap(head('06 · Invite','<em>Invite</em> '+PL.esc(pn()),'Send them the link. They make their own account and join your space.').concat([box,
    actions({next:h('button',{type:'button',class:'btn',onclick:function(){go('memory')}},'Continue'),skip:S.invited||state==='connected'?null:['I’ll invite them later',function(){go('memory')}]})]));
}
function memory(){
  var w0=PL.read(PL.KEYS.world,{})||{};
  var existing=(w0.moments||[]).filter(function(m){return m.by==='me'}).slice(-1)[0];
  if(existing&&PL.qa.state!=='memory'){
    ap(head('07 · First memory','<em>Your</em> first memory is saved').concat([
      h('div',{class:'card',style:'margin-top:22px'},h('span',{class:'pl-mono',style:'color:var(--muted)'},new Date(existing.date).toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})),h('p',{style:'margin:8px 0 0;font:400 1.4rem/1.2 var(--font-display);white-space:pre-wrap'},existing.text||'A photo')),
      actions({next:h('button',{type:'button',class:'btn',onclick:function(){go('reveal')}},'Continue')})]));return}
  var cap=PL.captureForm({kind:'text',submitLabel:'Save our first memory',textLabel:'What happened?',textPlaceholder:'Our first call, a joke, a walk…',
    save:function(m){return (PL.backend.connected?PL.sync.pushMoment(PL.space.get().id,m):Promise.resolve()).then(function(){var w=PL.read(PL.KEYS.world,{})||{};w.moments=Array.isArray(w.moments)?w.moments:[];w.moments.unshift(m);PL.write(PL.KEYS.world,w)})},
    onDone:function(m){PL.track('first_memory_created',{kind:m.type,source:'first_chapter'});go('reveal')}});
  ap(head('07 · First memory','<em>Save</em> your first memory','Start small. A dinner, a walk, a joke you still laugh about. It becomes the first page of your story.').concat([
    h('div',{style:'margin-top:24px'},cap),
    h('div',{class:'acts',style:'margin-top:14px'},h('button',{type:'button',class:'link',onclick:function(){go('invite')}},'Back'),h('span',{class:'sp'}),h('button',{type:'button',class:'link',onclick:function(){go('reveal')}},'Skip for now'))]));
}
function reveal(){
  var w=PL.read(PL.KEYS.world,{})||{},m=(w.moments||[]).filter(function(x){return x.by==='me'}).slice(-1)[0];
  var lines=S.ldr?['<em>Somewhere</em>','between the distance','you began.']:['<em>This</em> is where','your story','begins.'];
  var still=!PL.motion.ok();
  var mem=null;
  if(m){mem=h('div',{class:'memcard'},h('span',{class:'pl-mono'},'Your first memory · '+new Date(m.date).toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})));
    var imgBox=h('div');mem.append(imgBox);
    var u=PL.media.url(m.photo);
    if(u===undefined&&m.photo)PL.media.preload([m.photo]).then(function(){var uu=PL.media.url(m.photo);if(uu)imgBox.append(h('img',{src:uu,alt:''}))});
    else if(u)imgBox.append(h('img',{src:u,alt:''}));
    if(m.text)mem.append(h('p',null,m.text))}
  var hd=h('h1',{class:'head',tabindex:'-1',id:'rv-h'},lines.map(function(l){return h('span',{class:'mask'},h('span',{html:l}))}));
  var enter=h('button',{type:'button',class:'btn',onclick:function(){if(enter.disabled)return;enter.disabled=true;enter.replaceChildren(h('span',{class:'spin','aria-hidden':'true'}),'Opening…');location.href='world.html'}},'Enter Our World');
  var r=h('section',{class:'reveal'+(still?' on reveal-still':''),role:'region','aria-labelledby':'rv-h'},h('div',{class:'in-r'},
    h('span',{class:'pl-mono'},'Chapter one · '+(S.name.trim()||'You')+' & '+(S.pname.trim()||'your person')),h('span',{class:'rule','aria-hidden':'true'}),hd,mem,
    h('div',{class:'after'},h('p',null,'Your First Chapter is written. Everything you both add from here becomes your story, and it means more the longer you keep it.'),
      h('div',{class:'acts'},enter,h('a',{class:'link',href:'pricing.html?from=first_chapter',onclick:function(){PL.track('upgrade_clicked',{source:'first_chapter'})}},'What continuing looks like')))));
  document.body.append(r);main.append(h('p',{class:'vh'},'Chapter complete.'));
  if(!PL.qa.on){PL.progress.markDone();PL.track('first_chapter_completed',{})}
  /* anticipation → reveal → pause */
  if(!still)setTimeout(function(){r.classList.add('on');hd.focus({preventScroll:true})},700);else hd.focus({preventScroll:true});
  setTimeout(function(){enter.focus({preventScroll:true})},still?60:2700);
}
render();
})();
