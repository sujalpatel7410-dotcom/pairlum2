<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membership — Pairlum</title>
<meta name="description" content="Pairlum membership: two plans, Digital, or Digital plus a printed Pairlum Book.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A1226">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pairlum-core.css">
<script src="pairlum-core.js"></script>
<style>
main{max-width:1240px;margin:0 auto;padding:0 var(--pad) 60px}
main:focus{outline:none}
.intro{padding:clamp(20px,6vh,70px) 0 10px;max-width:900px}
.intro .pl-mono{color:var(--muted)}
.intro h1{margin:18px 0 0;font:400 var(--display-lg)/.86 var(--font-display);letter-spacing:-.038em;text-transform:uppercase}
.intro h1 em{text-transform:none;letter-spacing:-.055em}
.intro h1 .ln{display:block}
.intro p{margin:22px 0 0;max-width:46ch;color:var(--muted);font-size:1.06rem}
.free{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-top:30px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.free b{font:400 1.25rem var(--font-display);font-style:italic}
.free span{color:var(--muted);font-size:.95rem}
.plans{display:grid;gap:18px;margin-top:34px}
@media(min-width:860px){.plans{grid-template-columns:1fr 1fr;gap:24px}}
.plan{position:relative;display:flex;flex-direction:column;padding:28px;border-radius:28px;border:1.5px solid var(--line);background:var(--card)}
.plan.feature{background:linear-gradient(160deg,var(--g1),var(--g2) 60%,var(--g3));color:var(--gtext);border-color:transparent}
.plan .pl-mono{opacity:.75}
.plan h2{margin:14px 0 0;font:400 var(--h2)/.95 var(--font-display);letter-spacing:-.034em}
.plan .line{margin:12px 0 0;font:400 1.1rem/1.35 var(--font-display);font-style:italic;opacity:.9}
.price{margin:26px 0 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font:400 clamp(2.6rem,5vw,3.6rem)/1 var(--font-display);letter-spacing:-.04em}
.price span{opacity:.75}
.price .tba{font:400 1.4rem var(--font-display);font-style:italic}
.plan ul{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:10px;flex:1}
.plan li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.plan li::before{content:"↳";flex:none;opacity:.6;font-family:var(--font-display)}
.plan .terms{margin:20px 0 0;font-size:.84rem;opacity:.75}
.plan .btn{margin-top:22px}
.plan.feature .btn{background:var(--gtext);color:var(--g2)}
.plan .pl-pending{color:inherit;opacity:.8}
.faq{margin-top:56px;max-width:780px}
.faq h2{font:400 var(--h3)/1 var(--font-display)}
.faq details{border-top:1px solid var(--line);padding:4px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;gap:16px;min-height:56px;align-items:center;cursor:pointer;font-weight:500;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"↘";font-family:var(--font-display);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(180deg)}
.faq p{margin:0 0 16px;color:var(--muted);max-width:60ch}
/* checkout */
.co{max-width:620px;margin:0 auto}
.sumcard{margin-top:26px;padding:22px;border-radius:22px;border:1.5px solid var(--line);background:var(--card)}
.sumrow{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.sumrow:first-child{border-top:0;padding-top:0}
.sumrow span{color:var(--muted)}
.sumrow b{font-weight:500;text-align:right}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="pl-top"><a class="pl-wordmark" href="index.html" aria-label="Pairlum home">Pairlum</a><nav aria-label="Main" id="nav"></nav></header>
<main id="main" tabindex="-1"></main>
<footer class="pl-foot"><a href="legal.html#terms">Terms</a><a href="legal.html#refund">Cancellation &amp; refunds</a><a href="legal.html#book-terms">Pairlum Book terms</a><a href="legal.html#privacy">Privacy</a><span class="sp"></span><span>Pairlum is for adults 18+.</span></footer>
<script>
(function(){
var h=PL.h,$=PL.$,main=$('#main');
var sess=PL.auth.session(),from=PL.param('from')||'',planId=PL.param('plan')||'';
var nav=$('#nav');
if(sess)nav.append(h('a',{href:PL.home()},PL.space.get()?'Back to Our World':'Back to Pairlum'));
else nav.append(h('a',{href:'auth.html?next=pricing.html#login'},'Log in'),h('a',{href:'auth.html?next=pricing.html#signup'},'Start free'));

var CONTEXT={
  first_chapter:{label:'Your First Chapter is written',lines:['<em>Keep</em>','your story','growing']},
  book:{label:'The Pairlum Book',lines:['<em>Your</em> year','together,','in print']},
  world:{label:'Membership',lines:['<em>Keep</em>','your story','growing']},
  settings:{label:'Membership',lines:['<em>Choose</em>','how you','keep it']}
};
function priceLabel(p){var v=PL.price(p);return v?h('div',{class:'price'},h('b',null,v),h('span',null,'/ '+p.period)):h('div',{class:'price'},h('span',{class:'tba'},'Price announced before launch'))}

function plans(){
  var ctx=CONTEXT[from]||{label:'Membership',lines:['<em>Two</em> ways','to keep','your story']};
  document.title='Membership — Pairlum';
  main.replaceChildren(
    h('section',{class:'intro','aria-labelledby':'pt'},h('span',{class:'pl-mono'},ctx.label+' ↘'),
      h('h1',{id:'pt',html:ctx.lines.map(function(l){return '<span class="ln">'+l+'</span>'}).join('')}),
      h('p',null,from==='book'?'The printed Pairlum Book comes with Membership + Book, after a full year on that plan.':'Every couple begins with a First Chapter, free. Membership keeps your shared world growing, year after year.')),
    h('div',{class:'free'},h('b',null,'First Chapter'),h('span',null,'Free to start. Create your space, invite your person and keep your first memories. No card needed.')),
    h('div',{class:'plans'},PL.PRICING.plans.map(card)),
    faq());
  PL.track('pricing_viewed',{source:from||'direct'});
}
function card(p){
  var feature=p.id==='book';
  var btn=h('a',{class:'btn block',href:'pricing.html?plan='+p.id+(from?'&from='+from:'')+'#checkout',onclick:function(){PL.track('upgrade_clicked',{source:from||'pricing',plan:p.id})}},'Choose '+p.short);
  return h('article',{class:'plan'+(feature?' feature':''),'aria-labelledby':'p-'+p.id},
    h('span',{class:'pl-mono'},feature?'Digital + print':'Digital'),h('h2',{id:'p-'+p.id},p.short),h('p',{class:'line'},p.line),priceLabel(p),
    h('ul',null,p.features.map(function(f){return h('li',null,f)})),
    h('p',{class:'terms'},'Billed yearly. No automatic renewal in this version. 7-day full refund window. ',h('a',{href:feature?'legal.html#book-terms':'legal.html#refund'},feature?'Book terms':'Refund policy')),btn);
}
function faq(){
  function q(t,a){return h('details',null,h('summary',null,t),h('p',null,a))}
  return h('section',{class:'faq','aria-labelledby':'fq'},h('h2',{id:'fq'},'Good to know'),
    q('What happens after our First Chapter?','Everything you’ve made stays yours. Membership is how you keep adding to your shared world beyond the First Chapter.'),
    q('When does the printed Book arrive?','The Pairlum Book becomes available after a full year on the Membership + Book plan. It isn’t tied to how many memories you keep. After that, you choose what goes in and approve a proof before anything is printed.'),
    q('Does one membership cover both of us?','Yes. One membership covers one shared space for two people. You each keep your own account.'),
    q('Can we get a refund?','Yes. There’s a 7-day full refund window after a successful payment. The refund policy has the details.'),
    q('Is our data ever sold?','No. Pairlum doesn’t sell your private memories or relationship information, and private memories aren’t used as a general AI-training dataset.'));
}

/* ---------- checkout ---------- */
function coShell(label,big,sub,body,acts){
  main.replaceChildren(h('section',{class:'co'},h('div',{class:'pl-state','aria-labelledby':'ct'},h('span',{class:'pl-mono'},label),h('h1',{class:'st-big',id:'ct',tabindex:'-1',html:big}),
    sub?h('p',{class:'st-sub'},sub):null,body||null,acts&&acts.length?h('div',{class:'st-act'},acts):null)));
  document.title=label+' — Pairlum';$('#ct').focus({preventScroll:true});
}
function backToPlans(){return h('a',{class:'btn ghost',href:'pricing.html'+(from?'?from='+from:'')},'Back to plans')}
var CO={
  summary:function(p){
    var ok=h('input',{type:'checkbox',id:'agree'}),err=h('span',{class:'err',id:'agree-e','aria-live':'polite',style:'display:block;margin-top:6px;color:var(--danger);font-size:.86rem'});
    var cont=h('button',{class:'btn',type:'button'},'Continue to secure payment');
    cont.addEventListener('click',function(){if(cont.disabled)return;if(!ok.checked){err.textContent='Please confirm you’ve read the terms.';ok.focus();return}
      cont.disabled=true;PL.track('checkout_started',{plan:p.id});CO.starting(p);
      PL.billing.startCheckout(p.id).then(function(res){ /* >>> INTEGRATION POINT: res.redirectUrl → location.href */
        if(res&&res.redirectUrl)location.href=res.redirectUrl;else CO.processing(p)},
        function(e){if(PL.isPending(e))CO.pending(p);else if(e&&e.code==='offline')CO.failed(p,'You’re offline. Nothing was charged. Check your connection and try again.');else CO.failed(p)})});
    var price=PL.price(p);
    coShell('Checkout · '+p.short,'<em>Almost</em> there.',null,h('div',null,
      h('div',{class:'sumcard'},
        h('div',{class:'sumrow'},h('span',null,'Plan'),h('b',null,p.name)),
        h('div',{class:'sumrow'},h('span',null,'Price'),h('b',null,price?price+' / '+p.period:'Announced before launch')),
        h('div',{class:'sumrow'},h('span',null,'Term'),h('b',null,'1 year · covers your shared space')),
        h('div',{class:'sumrow'},h('span',null,'Renewal'),h('b',null,'No automatic renewal')),
        h('div',{class:'sumrow'},h('span',null,'Taxes'),h('b',null,'Shown before you pay')),
        p.id==='book'?h('div',{class:'sumrow'},h('span',null,'Pairlum Book'),h('b',null,'Available after 1 full year on this plan')):null),
      h('label',{class:'check',for:'agree'},ok,h('span',null,'I’ve read the ',h('a',{href:'legal.html#terms',target:'_blank'},'Terms'),', ',h('a',{href:'legal.html#refund',target:'_blank'},'Refund policy'),p.id==='book'?[' and ',h('a',{href:'legal.html#book-terms',target:'_blank'},'Pairlum Book terms')]:'','.')),err),
      [cont,backToPlans()]);
  },
  starting:function(p){coShell('Checkout · '+p.short,'<em>Preparing</em> secure checkout…','Please don’t close this page.',h('p',{class:'pl-mono',role:'status',style:'display:flex;gap:10px;align-items:center;margin-top:22px;color:var(--muted)'},h('span',{class:'spin','aria-hidden':'true'}),'Connecting'))},
  processing:function(p){coShell('Payment','<em>Confirming</em> your payment…','This can take a moment. Please keep this page open. Your membership starts only once the payment is confirmed.',h('p',{class:'pl-mono',role:'status',style:'display:flex;gap:10px;align-items:center;margin-top:22px;color:var(--muted)'},h('span',{class:'spin','aria-hidden':'true'}),'Waiting for confirmation'))},
  success:function(p,confirmed){
    if(confirmed)PL.track('purchase_completed',{plan:p.id});
    coShell('Membership active','<em>Welcome</em> to your year together.','Your membership is confirmed'+(p.id==='book'?'. Your Pairlum Book becomes available after a full year on this plan.':'.')+' A receipt is on its way to your email.',null,[h('a',{class:'btn',href:'world.html'},'Back to Our World')])},
  failed:function(p,msg){coShell('Payment didn’t go through','<em>Nothing</em> was charged.',msg||'Your payment wasn’t completed, so your membership hasn’t changed. You can try again, or use a different payment method.',null,
    [h('button',{class:'btn',type:'button',onclick:function(){CO.summary(p)}},'Try again'),backToPlans()])},
  cancelled:function(p){coShell('Checkout cancelled','<em>No</em> problem.','You left checkout before paying, so nothing was charged. Your First Chapter and everything in it are still here.',null,
    [h('button',{class:'btn',type:'button',onclick:function(){CO.summary(p)}},'Return to checkout'),backToPlans()])},
  pending:function(p){coShell('Not connected yet','<em>Payments</em> aren’t switched on yet.','Checkout starts working when Pairlum payments are connected. Nothing was charged.',
    h('p',{class:'pl-pending',style:'margin-top:20px'},'Checkout needs the connected payment backend'),[backToPlans(),h('a',{class:'link',href:sess?'world.html':'index.html'},sess?'Back to Our World':'Back to Pairlum')])}
};
function checkout(){
  var p=PL.plan(planId);
  if(!p){plans();return}
  if(!sess&&!PL.qa.on){location.replace('auth.html?next='+encodeURIComponent('pricing.html?plan='+p.id+'#checkout')+'#signup');return}
  var q=PL.qa.state,result=PL.param('result');
  if(q){({'checkout-loading':function(){CO.starting(p)},processing:function(){CO.processing(p)},success:function(){CO.success(p,false)},failed:function(){CO.failed(p)},cancelled:function(){CO.cancelled(p)},pending:function(){CO.pending(p)}}[q]||function(){CO.summary(p)})();return}
  if(result==='cancelled')return CO.cancelled(p);
  if(result==='failed')return CO.failed(p);
  if(result==='success'){CO.processing(p);   /* never trust the return URL alone: confirm with the server */
    PL.billing.confirm(PL.param('ref')).then(function(r){if(r&&r.status==='paid')CO.success(p,true);else CO.failed(p)},function(e){if(PL.isPending(e))CO.pending(p);else CO.failed(p)});return}
  CO.summary(p);
}
function route(){if(location.hash==='#checkout')checkout();else plans()}
window.addEventListener('hashchange',function(){planId=new URLSearchParams(location.search).get('plan')||planId;route();scrollTo(0,0)});
route();
})();
</script>
</body>
</html>
